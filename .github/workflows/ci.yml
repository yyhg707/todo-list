name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 单元测试
        run: npm test
      - name: 检查规约结构
        run: |
          test -f openspec/changes/add-todo-list/spec.md 2>/dev/null || \
          test -f openspec/changes/add-todo-list/specs/todo-list/spec.md
