<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>待办清单 · Todo List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <main id="main" class="app">
    <header class="head">
      <h1>待办清单</h1>
      <p class="sub">数据只保存在本机浏览器，不上传服务器。</p>
    </header>

    <form id="new-form" class="new" autocomplete="off">
      <label class="sr-only" for="new-text">新增待办</label>
      <input id="new-text" name="text" type="text" maxlength="200" required
             placeholder="要做什么？例如：复习第三章" aria-describedby="new-help">
      <button type="submit" class="primary">添加</button>
      <p id="new-help" class="help">回车或点击「添加」，内容 1–200 字。</p>
    </form>

    <section class="stats" aria-label="统计">
      <div><span>全部</span><strong id="count-total">0</strong></div>
      <div><span>未完成</span><strong id="count-active">0</strong></div>
      <div><span>已完成</span><strong id="count-done">0</strong></div>
    </section>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="筛选">
        <button type="button" data-filter="all" aria-pressed="true">全部</button>
        <button type="button" data-filter="active" aria-pressed="false">未完成</button>
        <button type="button" data-filter="completed" aria-pressed="false">已完成</button>
      </div>
      <button type="button" id="clear-completed" class="ghost" disabled>清除已完成</button>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <ul id="todo-list" class="list" aria-label="待办列表"></ul>
    <p id="empty" class="empty" hidden>还没有待办，先加一条。</p>

    <footer class="foot">
      <p>双击文字可直接编辑，回车保存，Esc 取消。</p>
      <p><a href="openspec/changes/add-todo-list/spec.md">查看验收规约</a></p>
    </footer>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
